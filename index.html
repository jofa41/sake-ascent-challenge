<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>サケ遡上チャレンジ</title>
<style>
:root{
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --ink:#fffdf9;
  --muted:rgba(255,247,238,.78);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#18334c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:none;color:var(--ink)}
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
#hud{
  height:82px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  align-items:center;
  padding:12px 14px;
  background:linear-gradient(180deg, rgba(22,44,66,.88), rgba(17,55,76,.76));
  border-bottom:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(12px);
}
.metric{text-align:center}
.metric small{display:block;font-size:12px;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.metric strong{display:block;font-size:26px;line-height:1.05;font-weight:800}
#gameWrap{position:relative;flex:1;min-height:0;background:#0e4363}
canvas{display:block;width:100%;height:100%}
#overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(4,12,20,.34);backdrop-filter:blur(3px)
}
.card{
  width:min(430px,92vw);padding:26px 22px;border-radius:26px;
  background:linear-gradient(180deg, rgba(43,74,96,.94), rgba(32,61,82,.92));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 18px 60px rgba(0,0,0,.34);
  text-align:center;
}
h1{margin:0 0 10px;font-size:30px;line-height:1.16;letter-spacing:.01em}
.subtitle{margin:0 0 16px;color:#cde9f8;line-height:1.72;font-size:15px}
.tip{
  margin:0 0 20px;padding:13px 14px;border-radius:16px;
  background:rgba(255,255,255,.06);color:#dceef9;line-height:1.66;font-size:14px
}
button{
  appearance:none;border:0;border-radius:18px;width:100%;
  padding:16px 22px;font-size:18px;font-weight:800;color:white;
  background:linear-gradient(180deg,#ffb97d,#ff8c73);
  box-shadow:0 8px 20px rgba(255,151,118,.28), inset 0 1px 0 rgba(255,255,255,.32);
}
button:active{transform:translateY(1px)}
#footer{position:absolute;left:0;right:0;bottom:12px;text-align:center;pointer-events:none}
.badge{
  display:inline-block;padding:7px 12px;border-radius:999px;
  background:rgba(255,255,255,.10);backdrop-filter:blur(8px);
  color:rgba(244,250,255,.88);font-size:12px;letter-spacing:.04em
}
@keyframes distancePop{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
#distance.pop{display:inline-block;animation:distancePop .34s ease-out}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="metric"><small>残り</small><strong id="time">30.0</strong></div>
    <div class="metric"><small>距離</small><strong><span id="distance">0</span>m</strong></div>
    <div class="metric"><small>ライフ</small><strong id="life">❤❤❤</strong></div>
  </div>
  <div id="gameWrap">
    <canvas id="game"></canvas>
    <div id="overlay">
      <div class="card">
        <h1>サケ遡上チャレンジ</h1>
        <p style="margin:-2px 0 12px;color:#ffe3ad;font-weight:800;letter-spacing:.08em">60秒モード</p>
        <p class="subtitle">左右にすべるように泳ぎ、岩と流木をかわして上流へ。<br>光る泡とヤナ突破で距離ボーナス。</p>
        <p class="tip">操作：画面を左右にスワイプ<br>60秒でどこまで遡上できるか挑戦<br>10秒ごとにヤナ関門が出現。安全な進路は必ず残ります</p>
        <button id="startBtn">遡上スタート</button>
      </div>
    </div>
    <div id="footer"><span class="badge">指一本でプレイ</span></div>
  </div>
</div>

  const rand = (a,b) => a + Math.random() * (b-a);
  const GATE_TIMES = [10,20,30,40,50,57];

  function resize(){
    const r = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(r.width * dpr);
    canvas.height = Math.floor(r.height * dpr);
    W = r.width; H = r.height;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    player.y = H * 0.77;
    if(!player.x){ player.x = W/2; player.targetX = W/2; }
  }
  addEventListener('resize', resize, {passive:true});
  resize();

  function updateHUD(){
    timeEl.textContent = Math.max(0,timeLeft).toFixed(1);
    distanceEl.textContent = Math.floor(distance);
    lifeEl.textContent = '❤'.repeat(Math.max(0,lives)) + '♡'.repeat(Math.max(0,3-lives));
  }

  function reset(){
    timeLeft = 60;
    distance = 0;
    lives = 3;
    spawnTimer = 0.35;
    bubbleTimer = 1.35;
    scroll = 0;
    shake = 0;
    obstacles = [];
    bubbles = [];
    particles = [];
    gates = [];
    feedbacks = [];
    gateStage = 0;
    player.x = W/2;
    player.targetX = W/2;
    player.y = H * 0.77;
    player.inv = 0;
    updateHUD();
  }

  function start(){
    reset();
    running = true;
    last = performance.now();
    overlay.classList.add('hidden');
    requestAnimationFrame(loop);
  }

  function end(){
    running = false;
    const best = Number(localStorage.getItem('sake60best') || 0);
    const score = Math.floor(distance);
    if(score > best) localStorage.setItem('sake60best', String(score));
    const newBest = Math.max(best, score);
    overlay.innerHTML = `
      <div class="card">
        <h1>${lives > 0 ? '遡上完了' : '力尽きた…'}</h1>
        <p class="subtitle"><span style="font-size:34px;font-weight:800;color:#fff">${score}m</span><br>自己ベスト ${newBest}m</p>
        <p class="tip">${score >= 1000 ? '見事な60秒完走です。六つのヤナを越えて上流へ到達しました。' : score >= 650 ? 'いい遡上です。後半の狭いヤナにも対応できています。' : '前半は進路を大きく取り、ヤナ前では中央を意識すると安定します。'}</p>
        <button id="againBtn">もう一度挑戦</button>
      </div>`;
    overlay.classList.remove('hidden');
    document.getElementById('againBtn').onclick = start;
  }

  function spawnObstacle(){
    const type = Math.random() < 0.58 ? 'rock' : 'log';
    const w = type === 'rock' ? rand(44,72) : rand(76,116);
    const h = type === 'rock' ? rand(30,52) : rand(18,28);
    obstacles.push({
      x: rand(16, W - w - 16),
      y: -90,
      w, h, type,
      rot: rand(-0.26, 0.26)
    });
  }

  function spawnBubble(){
    bubbles.push({x: rand(34, W-34), y: -40, r: 14, pulse: Math.random() * Math.PI * 2});
  }

  function burst(x, y, color, count=12, speed=120){
    for(let i=0;i<count;i++){
      particles.push({
        x, y,
        vx: rand(-speed, speed),
        vy: rand(-speed*1.2, speed*0.25),
        life: rand(0.35, 0.8),
        size: rand(2,5),
        color
      });
    }
  }

  function showBonus(text, x, y, kind='bubble'){
    feedbacks.push({
      text, x, y,
      life: 1.05,
      maxLife: 1.05,
      kind
    });
    distanceEl.classList.remove('pop');
    void distanceEl.offsetWidth;
    distanceEl.classList.add('pop');
  }

  function spawnGate(stage){
    const gapWidths = [190,170,150,135,120,108];
    const gapW = Math.min(gapWidths[stage] || 108, W - 100);
    const margin = 18;
    const minCenter = margin + gapW/2;
    const maxCenter = W - margin - gapW/2;

    // 現在の魚位置から無理なく到達できる範囲へ目を配置する。
    const desired = player.x + rand(-62, 62);
    const gapX = Math.max(minCenter, Math.min(maxCenter, desired));

    // 既に画面へ出た岩・流木は削除しない。
    // ヤナ前の新規出現停止により、障害物はヤナより先行したまま自然に流れる。

    gates.push({
      y: -76,
      h: 44,
      gapX,
      gapW,
      stage,
      dead: false,
      scored: false
    });
  }

  function gateHit(g){
    const top = g.y;
    const bottom = g.y + g.h;
    const pTop = player.y - 22;
    const pBottom = player.y + 22;
    if(pBottom < top || pTop > bottom) return false;
    const leftSafe = g.gapX - g.gapW/2 + 4;
    const rightSafe = g.gapX + g.gapW/2 - 4;
    const pLeft = player.x - 14;
    const pRight = player.x + 14;
    return pLeft < leftSafe || pRight > rightSafe;
  }

  function gatePassed(g){
    return g.y > player.y + 26;
  }

  function hit(a,b){
    return a.x-a.w*0.22 < b.x+b.w && a.x+a.w*0.22 > b.x &&
           a.y-a.h*0.20 < b.y+b.h && a.y+a.h*0.20 > b.y;
  }

  function update(dt){
    timeLeft -= dt;
    if(timeLeft <= 0){
      timeLeft = 0; updateHUD(); end(); return;
    }

    const elapsed = 60 - timeLeft;
    const speed = 112 + elapsed * 1.45;
    distance += dt * (speed / 5.8);
    scroll += dt * speed;

    player.x += (player.targetX - player.x) * Math.min(1, dt * 12);
    player.x = Math.max(player.w * 0.9, Math.min(W - player.w * 0.9, player.x));
    if(player.inv > 0) player.inv -= dt;

    if(gateStage < GATE_TIMES.length && elapsed >= GATE_TIMES[gateStage]){
      spawnGate(gateStage);
      gateStage++;
    }

    const activeGate = gates.some(g => !g.dead && g.y < player.y + 80);
    const nextGateTime = gateStage < GATE_TIMES.length ? GATE_TIMES[gateStage] : Infinity;
    const gateApproach = nextGateTime - elapsed <= 3.8;
    const safeGateWindow = activeGate || gateApproach;

    spawnTimer -= dt;
    if(spawnTimer <= 0){
      if(!safeGateWindow) spawnObstacle();
      spawnTimer = rand(0.82, 1.18) * Math.max(0.74, timeLeft / 60);
    }

    bubbleTimer -= dt;
    if(bubbleTimer <= 0){
      spawnBubble();
      bubbleTimer = rand(1.8, 2.9);
    }

    for(const o of obstacles) o.y += speed * dt;
    for(const b of bubbles){ b.y += speed * dt; b.pulse += dt * 4.6; }
    for(const g of gates) g.y += speed * dt;

    for(const o of obstacles){
      if(!o.dead && player.inv <= 0 && hit(player,o)){
        o.dead = true;
        lives--;
        player.inv = 1.15;
        shake = 0.32;
        burst(player.x, player.y - 8, 'rgba(230,247,255,.92)', 18, 150);
        updateHUD();
        if(lives <= 0){ end(); return; }
      }
    }

    for(const g of gates){
      if(!g.dead && player.inv <= 0 && gateHit(g)){
        g.dead = true;
        lives--;
        player.inv = 1.15;
        shake = 0.45;
        burst(player.x, player.y - 10, 'rgba(255,233,204,.95)', 22, 155);
        updateHUD();
        if(lives <= 0){ end(); return; }
      } else if(!g.dead && !g.scored && gatePassed(g)){
        g.scored = true;
        const gateBonus = 52 + g.stage * 8;
        distance += gateBonus;
        burst(player.x, player.y - 18, 'rgba(255,248,200,.95)', 16, 95);
        showBonus(`ヤナ突破  ＋${gateBonus}m`, player.x, player.y - 48, 'gate');
      }
    }

    for(const b of bubbles){
      const dx = player.x - b.x;
      const dy = player.y - b.y;
      if(!b.dead && dx*dx + dy*dy < 960){
        b.dead = true;
        distance += 36;
        burst(b.x, b.y, '#ffe07c', 16, 110);
        showBonus('＋36m', player.x, player.y - 42, 'bubble');
      }
    }

    obstacles = obstacles.filter(o => !o.dead && o.y < H + 100);
    bubbles = bubbles.filter(b => !b.dead && b.y < H + 60);
    gates = gates.filter(g => !g.dead && g.y < H + 80);

    for(const p of particles){
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 250 * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    for(const f of feedbacks){
      f.y -= 30 * dt;
      f.life -= dt;
    }
    feedbacks = feedbacks.filter(f => f.life > 0);
    if(shake > 0) shake -= dt;
    updateHUD();
  }

  function drawRiver(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#7fd3f7');
    g.addColorStop(0.52, '#4db4e5');
    g.addColorStop(1, '#2f90ca');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = 'rgba(255,255,255,.10)';
    for(let i=0;i<6;i++){
      const y = (i * 150 + scroll * 0.45) % (H + 180) - 90;
      ctx.beginPath();
      ctx.ellipse(W*0.5 + Math.sin(i + scroll*0.005)*40, y, 96, 18, 0, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.strokeStyle = 'rgba(255,255,255,.18)';
    ctx.lineWidth = 3.2;
    for(let i=0;i<7;i++){
      const x = i * 94 + (scroll * 0.18) % 94 - 50;
      ctx.beginPath();
      for(let y=-40;y<H+50;y+=30){
        const xx = x + Math.sin((y + scroll) * 0.013 + i * 0.7) * 12;
        if(y === -40) ctx.moveTo(xx, y); else ctx.lineTo(xx, y);
      }
      ctx.stroke();
    }

    ctx.fillStyle = '#3a886a';
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(26,0);
    for(let y=0;y<=H;y+=56) ctx.lineTo(12 + Math.sin((y + scroll) * 0.012) * 10, y);
    ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W,0); ctx.lineTo(W-26,0);
    for(let y=0;y<=H;y+=56) ctx.lineTo(W-12 - Math.sin((y + scroll) * 0.013) * 10, y);
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  }

  function drawObstacle(o){
    ctx.save();
    ctx.translate(o.x + o.w/2, o.y + o.h/2);
    ctx.rotate(o.rot);
    if(o.type === 'rock'){
      const rg = ctx.createLinearGradient(-o.w/2, -o.h/2, o.w/2, o.h/2);
      rg.addColorStop(0, '#9098aa');
      rg.addColorStop(1, '#6f778b');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(-o.w*0.45, o.h*0.12);
      ctx.quadraticCurveTo(-o.w*0.30, -o.h*0.46, 0, -o.h*0.44);
      ctx.quadraticCurveTo(o.w*0.38, -o.h*0.34, o.w*0.46, o.h*0.12);
      ctx.quadraticCurveTo(0, o.h*0.52, -o.w*0.45, o.h*0.12);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.20)';
      ctx.beginPath();
      ctx.ellipse(-o.w*0.09, -o.h*0.16, o.w*0.15, o.h*0.11, -0.3, 0, Math.PI*2);
      ctx.fill();
    } else {
      const lg = ctx.createLinearGradient(-o.w/2, 0, o.w/2, 0);
      lg.addColorStop(0, '#b97a4e');
      lg.addColorStop(0.5, '#cf8a5b');
      lg.addColorStop(1, '#a96d48');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(-o.w/2, -o.h/2);
      ctx.lineTo(o.w/2, -o.h*0.35);
      ctx.lineTo(o.w/2, o.h/2);
      ctx.lineTo(-o.w/2, o.h*0.38);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,238,208,.22)';
      ctx.lineWidth = 2;
      for(let x=-o.w/2+15;x<o.w/2;x+=18){
        ctx.beginPath(); ctx.moveTo(x,-o.h*0.40); ctx.lineTo(x+7,o.h*0.42); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawBubble(b){
    const r = b.r + Math.sin(b.pulse) * 1.7;
    ctx.save();
    ctx.shadowColor = 'rgba(255,211,96,.55)';
    ctx.shadowBlur = 14;
    const bg = ctx.createRadialGradient(b.x-3, b.y-4, 2, b.x, b.y, r);
    bg.addColorStop(0, '#fff8cf');
    bg.addColorStop(0.48, '#ffe784');
    bg.addColorStop(1, '#f5bf46');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(b.x,b.y,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.beginPath(); ctx.arc(b.x-4,b.y-5,r*0.22,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawGate(g){
    const railColor = '#ad7f53';
    const slatColor = '#d2a475';
    const outline = 'rgba(87,57,26,.55)';
    const y = g.y;
    const h = g.h;
    const gapLeft = g.gapX - g.gapW/2;
    const gapRight = g.gapX + g.gapW/2;

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.12)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = railColor;
    ctx.fillRect(0, y, gapLeft, h);
    ctx.fillRect(gapRight, y, W - gapRight, h);
    ctx.strokeStyle = outline;
    ctx.lineWidth = 1.2;
    ctx.strokeRect(0, y, gapLeft, h);
    ctx.strokeRect(gapRight, y, W - gapRight, h);

    ctx.fillStyle = '#8f6741';
    ctx.fillRect(0, y + 2, W, 5);
    ctx.fillRect(0, y + h - 7, W, 5);

    ctx.fillStyle = slatColor;
    for(let x = 10; x < gapLeft - 6; x += 12){
      ctx.fillRect(x, y + 6, 5, h - 12);
    }
    for(let x = gapRight + 6; x < W - 10; x += 12){
      ctx.fillRect(x, y + 6, 5, h - 12);
    }

    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.fillRect(0, y + 8, gapLeft, 4);
    ctx.fillRect(gapRight, y + 8, W - gapRight, 4);

    ctx.fillStyle = 'rgba(255,255,255,.90)';
    ctx.font = 'bold 12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`ヤナ ${g.stage + 1}`, W/2, y - 8);
    ctx.restore();
  }

  function drawSalmon(){
    if(player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0) return;
    const drawW = 64;
    const drawH = 108;
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.shadowColor = 'rgba(0,0,0,.16)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 5;
    if(salmonSprite.complete){
      ctx.drawImage(salmonSprite, -drawW/2, -drawH/2, drawW, drawH);
    }
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      ctx.globalAlpha = Math.max(0, p.life * 1.8);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFeedbacks(){
    for(const f of feedbacks){
      const progress = 1 - f.life / f.maxLife;
      const alpha = Math.min(1, f.life * 2.4);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = f.kind === 'gate'
        ? '800 18px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif'
        : '800 20px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
      ctx.lineWidth = 5;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(20,45,62,.72)';
      ctx.fillStyle = f.kind === 'gate' ? '#fff3b0' : '#fff7cf';
      const scale = 1 + Math.sin(Math.min(1, progress * 2) * Math.PI) * 0.08;
      ctx.translate(f.x, f.y);
      ctx.scale(scale, scale);
      ctx.strokeText(f.text, 0, 0);
      ctx.fillText(f.text, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function draw(){
    ctx.save();
    if(shake > 0) ctx.translate(rand(-4,4), rand(-4,4));
    drawRiver();
    for(const b of bubbles) drawBubble(b);
    for(const o of obstacles) drawObstacle(o);
    for(const g of gates) drawGate(g);
    drawSalmon();
    drawParticles();
    drawFeedbacks();
    ctx.restore();
  }

  function loop(now){
    if(!running) return;
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    if(running) requestAnimationFrame(loop);
  }

  function setTarget(clientX){
    const r = canvas.getBoundingClientRect();
    player.targetX = clientX - r.left;
  }

  canvas.addEventListener('pointerdown', e => {
    if(running){ canvas.setPointerCapture(e.pointerId); setTarget(e.clientX); }
  });
  canvas.addEventListener('pointermove', e => {
    if(running && e.buttons) setTarget(e.clientX);
  });
  canvas.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
  startBtn.onclick = start;
  draw();
})();
</script>
</body>
</html>
