<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>サケ遡上30秒チャレンジ v6</title>
<style>
:root{
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --ink:#fffdf9;
  --muted:rgba(255,247,238,.78);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#18334c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:none;color:var(--ink)}
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
#hud{
  height:82px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  align-items:center;
  padding:12px 14px;
  background:linear-gradient(180deg, rgba(22,44,66,.88), rgba(17,55,76,.76));
  border-bottom:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(12px);
}
.metric{text-align:center}
.metric small{display:block;font-size:12px;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.metric strong{display:block;font-size:26px;line-height:1.05;font-weight:800}
#gameWrap{position:relative;flex:1;min-height:0;background:#0e4363}
canvas{display:block;width:100%;height:100%}
#overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(4,12,20,.34);backdrop-filter:blur(3px)
}
.card{
  width:min(430px,92vw);padding:26px 22px;border-radius:26px;
  background:linear-gradient(180deg, rgba(43,74,96,.94), rgba(32,61,82,.92));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 18px 60px rgba(0,0,0,.34);
  text-align:center;
}
h1{margin:0 0 10px;font-size:30px;line-height:1.16;letter-spacing:.01em}
.subtitle{margin:0 0 16px;color:#cde9f8;line-height:1.72;font-size:15px}
.tip{
  margin:0 0 20px;padding:13px 14px;border-radius:16px;
  background:rgba(255,255,255,.06);color:#dceef9;line-height:1.66;font-size:14px
}
button{
  appearance:none;border:0;border-radius:18px;width:100%;
  padding:16px 22px;font-size:18px;font-weight:800;color:white;
  background:linear-gradient(180deg,#ffb97d,#ff8c73);
  box-shadow:0 8px 20px rgba(255,151,118,.28), inset 0 1px 0 rgba(255,255,255,.32);
}
button:active{transform:translateY(1px)}
#footer{position:absolute;left:0;right:0;bottom:12px;text-align:center;pointer-events:none}
.badge{
  display:inline-block;padding:7px 12px;border-radius:999px;
  background:rgba(255,255,255,.10);backdrop-filter:blur(8px);
  color:rgba(244,250,255,.88);font-size:12px;letter-spacing:.04em
}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="metric"><small>残り</small><strong id="time">30.0</strong></div>
    <div class="metric"><small>距離</small><strong><span id="distance">0</span>m</strong></div>
    <div class="metric"><small>ライフ</small><strong id="life">❤❤❤</strong></div>
  </div>
  <div id="gameWrap">
    <canvas id="game"></canvas>
    <div id="overlay">
      <div class="card">
        <h1>サケ遡上30秒チャレンジ</h1>
        <p class="subtitle">左右にすべるように泳ぎ、岩と流木をかわして上流へ。<br>きらきらの泡を取ると距離ボーナスです。</p>
        <p class="tip">操作：画面を左右にスワイプ<br>30秒でどこまで遡上できるか挑戦</p>
        <button id="startBtn">遡上スタート</button>
      </div>
    </div>
    <div id="footer"><span class="badge">指一本でプレイ</span></div>
  </div>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const timeEl = document.getElementById('time');
  const distanceEl = document.getElementById('distance');
  const lifeEl = document.getElementById('life');

  let W=0, H=0, dpr=1;
  let running=false, last=0, timeLeft=30, distance=0, lives=3;
  let spawnTimer=0, bubbleTimer=0, scroll=0, shake=0;
  let obstacles=[], bubbles=[], particles=[];
  const player = {x:0,y:0,w:34,h:84,targetX:0,inv:0};

  const rand = (a,b) => a + Math.random() * (b-a);

  function resize(){
    const r = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(r.width * dpr);
    canvas.height = Math.floor(r.height * dpr);
    W = r.width; H = r.height;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    player.y = H * 0.77;
    if(!player.x){ player.x = W/2; player.targetX = W/2; }
  }
  addEventListener('resize', resize, {passive:true});
  resize();

  function updateHUD(){
    timeEl.textContent = Math.max(0,timeLeft).toFixed(1);
    distanceEl.textContent = Math.floor(distance);
    lifeEl.textContent = '❤'.repeat(Math.max(0,lives)) + '♡'.repeat(Math.max(0,3-lives));
  }

  function reset(){
    timeLeft = 30;
    distance = 0;
    lives = 3;
    spawnTimer = 0.35;
    bubbleTimer = 1.35;
    scroll = 0;
    shake = 0;
    obstacles = [];
    bubbles = [];
    particles = [];
    player.x = W/2;
    player.targetX = W/2;
    player.y = H * 0.77;
    player.inv = 0;
    updateHUD();
  }

  function start(){
    reset();
    running = true;
    last = performance.now();
    overlay.classList.add('hidden');
    requestAnimationFrame(loop);
  }

  function end(){
    running = false;
    const best = Number(localStorage.getItem('sake30best') || 0);
    const score = Math.floor(distance);
    if(score > best) localStorage.setItem('sake30best', String(score));
    const newBest = Math.max(best, score);
    overlay.innerHTML = `
      <div class="card">
        <h1>${lives > 0 ? '遡上完了' : '力尽きた…'}</h1>
        <p class="subtitle"><span style="font-size:34px;font-weight:800;color:#fff">${score}m</span><br>自己ベスト ${newBest}m</p>
        <p class="tip">${score >= 500 ? '素晴らしい流れです。かなり上流まで到達しました。' : score >= 300 ? 'いい感じです。次は泡を拾って距離を伸ばしましょう。' : 'まずはコース取りを意識すると安定します。'}</p>
        <button id="againBtn">もう一度挑戦</button>
      </div>`;
    overlay.classList.remove('hidden');
    document.getElementById('againBtn').onclick = start;
  }

  function spawnObstacle(){
    const type = Math.random() < 0.58 ? 'rock' : 'log';
    const w = type === 'rock' ? rand(44,72) : rand(76,116);
    const h = type === 'rock' ? rand(30,52) : rand(18,28);
    obstacles.push({
      x: rand(16, W - w - 16),
      y: -90,
      w, h, type,
      rot: rand(-0.26, 0.26)
    });
  }

  function spawnBubble(){
    bubbles.push({x: rand(34, W-34), y: -40, r: 14, pulse: Math.random() * Math.PI * 2});
  }

  function burst(x, y, color, count=12, speed=120){
    for(let i=0;i<count;i++){
      particles.push({
        x, y,
        vx: rand(-speed, speed),
        vy: rand(-speed*1.2, speed*0.25),
        life: rand(0.35, 0.8),
        size: rand(2,5),
        color
      });
    }
  }

  function hit(a,b){
    return a.x-a.w*0.22 < b.x+b.w && a.x+a.w*0.22 > b.x &&
           a.y-a.h*0.20 < b.y+b.h && a.y+a.h*0.20 > b.y;
  }

  function update(dt){
    timeLeft -= dt;
    if(timeLeft <= 0){
      timeLeft = 0; updateHUD(); end(); return;
    }

    const speed = 118 + (30 - timeLeft) * 2.05;
    distance += dt * (speed / 5.8);
    scroll += dt * speed;

    player.x += (player.targetX - player.x) * Math.min(1, dt * 12);
    player.x = Math.max(player.w * 0.9, Math.min(W - player.w * 0.9, player.x));
    if(player.inv > 0) player.inv -= dt;

    spawnTimer -= dt;
    if(spawnTimer <= 0){
      spawnObstacle();
      spawnTimer = rand(0.82, 1.18) * Math.max(0.78, timeLeft / 30);
    }

    bubbleTimer -= dt;
    if(bubbleTimer <= 0){
      spawnBubble();
      bubbleTimer = rand(1.8, 2.9);
    }

    for(const o of obstacles) o.y += speed * dt;
    for(const b of bubbles){ b.y += speed * dt; b.pulse += dt * 4.6; }

    for(const o of obstacles){
      if(!o.dead && player.inv <= 0 && hit(player,o)){
        o.dead = true;
        lives--;
        player.inv = 1.15;
        shake = 0.32;
        burst(player.x, player.y - 8, 'rgba(230,247,255,.92)', 18, 150);
        updateHUD();
        if(lives <= 0){ end(); return; }
      }
    }

    for(const b of bubbles){
      const dx = player.x - b.x;
      const dy = player.y - b.y;
      if(!b.dead && dx*dx + dy*dy < 960){
        b.dead = true;
        distance += 36;
        burst(b.x, b.y, '#ffe07c', 16, 110);
      }
    }

    obstacles = obstacles.filter(o => !o.dead && o.y < H + 100);
    bubbles = bubbles.filter(b => !b.dead && b.y < H + 60);

    for(const p of particles){
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 250 * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
    if(shake > 0) shake -= dt;
    updateHUD();
  }

  function drawRiver(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#7fd3f7');
    g.addColorStop(0.52, '#4db4e5');
    g.addColorStop(1, '#2f90ca');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = 'rgba(255,255,255,.10)';
    for(let i=0;i<6;i++){
      const y = (i * 150 + scroll * 0.45) % (H + 180) - 90;
      ctx.beginPath();
      ctx.ellipse(W*0.5 + Math.sin(i + scroll*0.005)*40, y, 96, 18, 0, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.strokeStyle = 'rgba(255,255,255,.18)';
    ctx.lineWidth = 3.2;
    for(let i=0;i<7;i++){
      const x = i * 94 + (scroll * 0.18) % 94 - 50;
      ctx.beginPath();
      for(let y=-40;y<H+50;y+=30){
        const xx = x + Math.sin((y + scroll) * 0.013 + i * 0.7) * 12;
        if(y === -40) ctx.moveTo(xx, y); else ctx.lineTo(xx, y);
      }
      ctx.stroke();
    }

    ctx.fillStyle = '#3a886a';
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(26,0);
    for(let y=0;y<=H;y+=56) ctx.lineTo(12 + Math.sin((y + scroll) * 0.012) * 10, y);
    ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W,0); ctx.lineTo(W-26,0);
    for(let y=0;y<=H;y+=56) ctx.lineTo(W-12 - Math.sin((y + scroll) * 0.013) * 10, y);
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  }

  function drawObstacle(o){
    ctx.save();
    ctx.translate(o.x + o.w/2, o.y + o.h/2);
    ctx.rotate(o.rot);
    if(o.type === 'rock'){
      const rg = ctx.createLinearGradient(-o.w/2, -o.h/2, o.w/2, o.h/2);
      rg.addColorStop(0, '#9098aa');
      rg.addColorStop(1, '#6f778b');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(-o.w*0.45, o.h*0.12);
      ctx.quadraticCurveTo(-o.w*0.30, -o.h*0.46, 0, -o.h*0.44);
      ctx.quadraticCurveTo(o.w*0.38, -o.h*0.34, o.w*0.46, o.h*0.12);
      ctx.quadraticCurveTo(0, o.h*0.52, -o.w*0.45, o.h*0.12);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.20)';
      ctx.beginPath();
      ctx.ellipse(-o.w*0.09, -o.h*0.16, o.w*0.15, o.h*0.11, -0.3, 0, Math.PI*2);
      ctx.fill();
    } else {
      const lg = ctx.createLinearGradient(-o.w/2, 0, o.w/2, 0);
      lg.addColorStop(0, '#b97a4e');
      lg.addColorStop(0.5, '#cf8a5b');
      lg.addColorStop(1, '#a96d48');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(-o.w/2, -o.h/2);
      ctx.lineTo(o.w/2, -o.h*0.35);
      ctx.lineTo(o.w/2, o.h/2);
      ctx.lineTo(-o.w/2, o.h*0.38);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,238,208,.22)';
      ctx.lineWidth = 2;
      for(let x=-o.w/2+15;x<o.w/2;x+=18){
        ctx.beginPath(); ctx.moveTo(x,-o.h*0.40); ctx.lineTo(x+7,o.h*0.42); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawBubble(b){
    const r = b.r + Math.sin(b.pulse) * 1.7;
    ctx.save();
    ctx.shadowColor = 'rgba(255,211,96,.55)';
    ctx.shadowBlur = 14;
    const bg = ctx.createRadialGradient(b.x-3, b.y-4, 2, b.x, b.y, r);
    bg.addColorStop(0, '#fff8cf');
    bg.addColorStop(0.48, '#ffe784');
    bg.addColorStop(1, '#f5bf46');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(b.x,b.y,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.beginPath(); ctx.arc(b.x-4,b.y-5,r*0.22,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawSalmon(){
    if(player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0) return;
    const x = player.x, y = player.y;
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = 'rgba(0,0,0,.10)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 4;

    // tail fin
    ctx.fillStyle = '#8ea2b3';
    ctx.beginPath();
    ctx.moveTo(0, player.h*0.34);
    ctx.lineTo(-12, player.h*0.54);
    ctx.lineTo(0, player.h*0.46);
    ctx.lineTo(12, player.h*0.54);
    ctx.closePath();
    ctx.fill();

    // body silhouette: silver, simple top-down view
    const body = ctx.createLinearGradient(0, -player.h*0.48, 0, player.h*0.43);
    body.addColorStop(0, '#c8d6df');
    body.addColorStop(0.22, '#eef4f7');
    body.addColorStop(0.55, '#dde6eb');
    body.addColorStop(1, '#aebfca');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(0, -player.h*0.48);
    ctx.bezierCurveTo(-12, -player.h*0.41, -18, -player.h*0.08, -15, player.h*0.25);
    ctx.bezierCurveTo(-11, player.h*0.40, -5, player.h*0.44, 0, player.h*0.44);
    ctx.bezierCurveTo(5, player.h*0.44, 11, player.h*0.40, 15, player.h*0.25);
    ctx.bezierCurveTo(18, -player.h*0.08, 12, -player.h*0.41, 0, -player.h*0.48);
    ctx.closePath();
    ctx.fill();

    // blue head/back cap
    const head = ctx.createLinearGradient(0, -player.h*0.48, 0, -player.h*0.05);
    head.addColorStop(0, '#5f7f97');
    head.addColorStop(1, '#89a3b4');
    ctx.fillStyle = head;
    ctx.beginPath();
    ctx.moveTo(0, -player.h*0.48);
    ctx.bezierCurveTo(-11, -player.h*0.41, -13, -player.h*0.22, -10, -player.h*0.02);
    ctx.quadraticCurveTo(0, player.h*0.03, 10, -player.h*0.02);
    ctx.bezierCurveTo(13, -player.h*0.22, 11, -player.h*0.41, 0, -player.h*0.48);
    ctx.closePath();
    ctx.fill();

    // side fins
    ctx.fillStyle = '#97aaba';
    ctx.beginPath();
    ctx.moveTo(-12, 2); ctx.lineTo(-24, 15); ctx.lineTo(-11, 18); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(12, 2); ctx.lineTo(24, 15); ctx.lineTo(11, 18); ctx.closePath(); ctx.fill();

    // dorsal fin
    ctx.fillStyle = '#7892a4';
    ctx.beginPath();
    ctx.moveTo(0, -player.h*0.22); ctx.lineTo(-5, -player.h*0.08); ctx.lineTo(5, -player.h*0.08); ctx.closePath();
    ctx.fill();

    // soft belly/light line
    ctx.strokeStyle = 'rgba(255,255,255,.70)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -2); ctx.lineTo(0, 22);
    ctx.stroke();

    // subtle decorative body marks only; no facial detail
    ctx.strokeStyle = 'rgba(255,255,255,.42)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-7, 4); ctx.quadraticCurveTo(0, 8, 7, 4);
    ctx.moveTo(-6, 15); ctx.quadraticCurveTo(0, 19, 6, 15);
    ctx.stroke();

    ctx.fillStyle = 'rgba(84,106,121,.18)';
    for(const [sx,sy,r] of [[-6,-8,1.3],[5,-1,1.2],[-5,8,1.1],[4,17,1.0]]){
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
    }

    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      ctx.globalAlpha = Math.max(0, p.life * 1.8);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw(){
    ctx.save();
    if(shake > 0) ctx.translate(rand(-4,4), rand(-4,4));
    drawRiver();
    for(const b of bubbles) drawBubble(b);
    for(const o of obstacles) drawObstacle(o);
    drawSalmon();
    drawParticles();
    ctx.restore();
  }

  function loop(now){
    if(!running) return;
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    if(running) requestAnimationFrame(loop);
  }

  function setTarget(clientX){
    const r = canvas.getBoundingClientRect();
    player.targetX = clientX - r.left;
  }

  canvas.addEventListener('pointerdown', e => {
    if(running){ canvas.setPointerCapture(e.pointerId); setTarget(e.clientX); }
  });
  canvas.addEventListener('pointermove', e => {
    if(running && e.buttons) setTarget(e.clientX);
  });
  canvas.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
  startBtn.onclick = start;
  draw();
})();
</script>
</body>
</html>
