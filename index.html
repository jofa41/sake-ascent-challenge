<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>サケ遡上30秒チャレンジ</title>
<style>
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#081a2b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{touch-action:none;color:#fff}
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
#hud{height:76px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center;padding:10px 12px;background:rgba(4,17,29,.95);border-bottom:1px solid rgba(255,255,255,.15)}
.metric{text-align:center}.metric small{display:block;font-size:12px;opacity:.72;letter-spacing:.08em}.metric strong{display:block;font-size:25px;line-height:1.1}
#gameWrap{position:relative;flex:1;min-height:0}canvas{display:block;width:100%;height:100%;background:#0b5f86}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,20,32,.50);backdrop-filter:blur(3px)}
.card{width:min(420px,92vw);border-radius:24px;padding:26px 22px;background:rgba(4,25,41,.93);border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center}
h1{margin:0 0 8px;font-size:30px;line-height:1.15}.subtitle{margin:0 0 20px;color:#b9eaff;line-height:1.65}.tip{font-size:14px;line-height:1.6;color:#d6edf7;background:rgba(255,255,255,.07);padding:12px;border-radius:14px;margin:14px 0 20px}
button{appearance:none;border:0;border-radius:16px;font-weight:800;font-size:18px;padding:15px 22px;background:#ff7a3d;color:#fff;box-shadow:0 7px 0 #a93f18;width:100%}button:active{transform:translateY(3px);box-shadow:0 4px 0 #a93f18}
#footer{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:rgba(255,255,255,.65);pointer-events:none}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.11)}.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
<div id="hud"><div class="metric"><small>残り</small><strong id="time">30.0</strong></div><div class="metric"><small>距離</small><strong><span id="distance">0</span>m</strong></div><div class="metric"><small>ライフ</small><strong id="life">❤️❤️❤️</strong></div></div>
<div id="gameWrap"><canvas id="game"></canvas><div id="overlay"><div class="card"><h1>🐟 サケ遡上<br>30秒チャレンジ</h1><p class="subtitle">左右に指を滑らせ、岩と流木をかわして上流へ。</p><div class="tip">操作：画面を左右にスワイプ<br>金色の泡を取るとボーナス</div><button id="startBtn">遡上スタート</button></div></div><div id="footer"><span class="badge">指一本でプレイ</span></div></div>
</div>
<script>
(()=>{"use strict";const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),overlay=document.getElementById("overlay"),startBtn=document.getElementById("startBtn"),timeEl=document.getElementById("time"),distanceEl=document.getElementById("distance"),lifeEl=document.getElementById("life");let W=0,H=0,dpr=1,running=false,last=0,timeLeft=30,distance=0,lives=3,spawnTimer=0,bubbleTimer=0,scroll=0,shake=0;let player={x:0,y:0,w:40,h:76,targetX:0,inv:0},obstacles=[],bubbles=[],particles=[];
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.floor(r.width*dpr);canvas.height=Math.floor(r.height*dpr);W=r.width;H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);player.y=H*.72;if(!player.x){player.x=W/2;player.targetX=W/2}}addEventListener("resize",resize,{passive:true});resize();
function reset(){timeLeft=30;distance=0;lives=3;spawnTimer=.25;bubbleTimer=1.2;obstacles=[];bubbles=[];particles=[];scroll=0;shake=0;player.x=W/2;player.targetX=W/2;player.y=H*.72;player.inv=0;updateHUD()}
function updateHUD(){timeEl.textContent=Math.max(0,timeLeft).toFixed(1);distanceEl.textContent=Math.floor(distance);lifeEl.textContent="❤️".repeat(Math.max(0,lives))+"🖤".repeat(Math.max(0,3-lives))}
function start(){reset();running=true;last=performance.now();overlay.classList.add("hidden");requestAnimationFrame(loop)}
function end(){running=false;const best=Number(localStorage.getItem("sake30best")||0),score=Math.floor(distance);if(score>best)localStorage.setItem("sake30best",String(score));const newBest=Math.max(best,score);overlay.innerHTML=`<div class="card"><h1>${lives>0?"🏁 遡上完了":"🌊 力尽きた…"}</h1><p class="subtitle"><b style="font-size:34px">${score}m</b><br>自己ベスト ${newBest}m</p><div class="tip">${score>=500?"産卵場が見えてきた！":score>=300?"いい流れに乗った！":"次は岩の間を滑り抜けよう。"}</div><button id="againBtn">もう一度挑戦</button></div>`;overlay.classList.remove("hidden");document.getElementById("againBtn").onclick=start}
const rand=(a,b)=>a+Math.random()*(b-a);function spawnObstacle(){const type=Math.random()<.55?"rock":"log",w=type==="rock"?rand(45,72):rand(72,110),h=type==="rock"?rand(38,60):rand(24,34);obstacles.push({x:rand(10,W-w-10),y:-80,w,h,type,rot:rand(-.2,.2)})}function spawnBubble(){bubbles.push({x:rand(28,W-28),y:-30,r:13,pulse:Math.random()*6.28})}
function hit(a,b){return a.x-a.w*.32<b.x+b.w&&a.x+a.w*.32>b.x&&a.y-a.h*.30<b.y+b.h&&a.y+a.h*.30>b.y}function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-120,120),vy:rand(-140,50),life:rand(.3,.7),color})}
function update(dt){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;updateHUD();end();return}const speed=150+(30-timeLeft)*3.2;distance+=dt*(speed/6);scroll+=dt*speed;player.x+=(player.targetX-player.x)*Math.min(1,dt*12);player.x=Math.max(player.w*.55,Math.min(W-player.w*.55,player.x));if(player.inv>0)player.inv-=dt;spawnTimer-=dt;if(spawnTimer<=0){spawnObstacle();spawnTimer=rand(.48,.82)*Math.max(.62,timeLeft/30)}bubbleTimer-=dt;if(bubbleTimer<=0){spawnBubble();bubbleTimer=rand(1.6,2.8)}for(const o of obstacles)o.y+=speed*dt;for(const b of bubbles){b.y+=speed*dt;b.pulse+=dt*5}for(const o of obstacles){if(!o.dead&&player.inv<=0&&hit(player,o)){o.dead=true;lives--;player.inv=1.15;shake=.35;burst(player.x,player.y,"#d9f2ff",18);updateHUD();if(lives<=0){end();return}}}for(const b of bubbles){const dx=player.x-b.x,dy=player.y-b.y;if(!b.dead&&dx*dx+dy*dy<900){b.dead=true;distance+=35;burst(b.x,b.y,"#ffd969",14)}}obstacles=obstacles.filter(o=>!o.dead&&o.y<H+100);bubbles=bubbles.filter(b=>!b.dead&&b.y<H+50);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(shake>0)shake-=dt;updateHUD()}
function drawRiver(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0d7da8");g.addColorStop(1,"#06486c");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle="rgba(255,255,255,.11)";ctx.lineWidth=3;for(let i=0;i<8;i++){const x=i*83+(scroll*.28)%83-50;ctx.beginPath();for(let y=-30;y<H+40;y+=30){const xx=x+Math.sin((y+scroll)*.018+i)*14;y===-30?ctx.moveTo(xx,y):ctx.lineTo(xx,y)}ctx.stroke()}ctx.fillStyle="#1b4a38";ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(24,0);for(let y=0;y<H;y+=55)ctx.lineTo(12+Math.sin((y+scroll)*.012)*12,y);ctx.lineTo(0,H);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(W-24,0);for(let y=0;y<H;y+=55)ctx.lineTo(W-12-Math.sin((y+scroll)*.013)*12,y);ctx.lineTo(W,H);ctx.closePath();ctx.fill()}
function drawObstacle(o){ctx.save();ctx.translate(o.x+o.w/2,o.y+o.h/2);ctx.rotate(o.rot);if(o.type==="rock"){ctx.fillStyle="#52606a";ctx.beginPath();ctx.moveTo(-o.w*.5,o.h*.2);ctx.quadraticCurveTo(-o.w*.35,-o.h*.55,0,-o.h*.5);ctx.quadraticCurveTo(o.w*.45,-o.h*.35,o.w*.5,o.h*.25);ctx.quadraticCurveTo(0,o.h*.55,-o.w*.5,o.h*.2);ctx.fill();ctx.fillStyle="rgba(255,255,255,.18)";ctx.beginPath();ctx.ellipse(-8,-10,12,6,-.3,0,6.28);ctx.fill()}else{ctx.fillStyle="#6e452c";ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);ctx.strokeStyle="#9b6845";ctx.lineWidth=3;for(let x=-o.w/2+12;x<o.w/2;x+=18){ctx.beginPath();ctx.moveTo(x,-o.h/2);ctx.lineTo(x+8,o.h/2);ctx.stroke()}}ctx.restore()}
function drawBubble(b){const r=b.r+Math.sin(b.pulse)*2;ctx.save();ctx.shadowColor="#ffd54d";ctx.shadowBlur=18;ctx.fillStyle="#ffd54d";ctx.beginPath();ctx.arc(b.x,b.y,r,0,6.28);ctx.fill();ctx.fillStyle="#fff4ae";ctx.beginPath();ctx.arc(b.x-4,b.y-4,r*.28,0,6.28);ctx.fill();ctx.restore()}
function drawSalmon(){if(player.inv>0&&Math.floor(player.inv*12)%2===0)return;const x=player.x,y=player.y;ctx.save();ctx.translate(x,y);ctx.shadowColor="rgba(0,0,0,.25)";ctx.shadowBlur=8;ctx.shadowOffsetY=5;ctx.fillStyle="#ff7a46";ctx.beginPath();ctx.ellipse(0,0,player.w*.42,player.h*.38,0,0,6.28);ctx.fill();ctx.beginPath();ctx.moveTo(0,-player.h*.34);ctx.lineTo(-18,-player.h*.58);ctx.lineTo(18,-player.h*.58);ctx.closePath();ctx.fill();ctx.fillStyle="#f15a39";ctx.beginPath();ctx.moveTo(-player.w*.3,5);ctx.lineTo(-player.w*.62,18);ctx.lineTo(-player.w*.33,-10);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(player.w*.3,5);ctx.lineTo(player.w*.62,18);ctx.lineTo(player.w*.33,-10);ctx.closePath();ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-10,-18,4,0,6.28);ctx.arc(10,-18,4,0,6.28);ctx.fill();ctx.fillStyle="#17212b";ctx.beginPath();ctx.arc(-10,-18,2,0,6.28);ctx.arc(10,-18,2,0,6.28);ctx.fill();ctx.strokeStyle="rgba(255,255,255,.45)";ctx.lineWidth=2;for(let yy=-2;yy<22;yy+=9){ctx.beginPath();ctx.moveTo(-13,yy);ctx.lineTo(13,yy);ctx.stroke()}ctx.restore()}
function draw(){ctx.save();if(shake>0)ctx.translate(rand(-5,5),rand(-5,5));drawRiver();for(const b of bubbles)drawBubble(b);for(const o of obstacles)drawObstacle(o);drawSalmon();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;ctx.restore()}
function loop(now){if(!running)return;const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}function setTarget(clientX){const r=canvas.getBoundingClientRect();player.targetX=clientX-r.left}canvas.addEventListener("pointerdown",e=>{if(running){canvas.setPointerCapture(e.pointerId);setTarget(e.clientX)}});canvas.addEventListener("pointermove",e=>{if(running&&e.buttons)setTarget(e.clientX)});canvas.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});startBtn.onclick=start;draw()})();
</script>
</body>
</html>
